# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Configuration de CodeRabbit pour my-cloud-platform
language: fr

reviews:
  auto_review:
    enabled: true
    auto_incremental_review: true
  poem: false
  collapse_walkthrough: true
  path_filters:
    - "!data/**"
    - "!web/metrics.json"
    - "!web/missions.json"
    - "!missions/**"
